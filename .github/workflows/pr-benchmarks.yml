name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@just

      - name: Fetch assets
        run: just fetch-assets

      - name: Fetch Rust dependencies
        run: cargo fetch

      - name: Run tests
        id: tests
        shell: bash
        run: |
          mkdir -p .github/tmp

          set +e
          cargo test --no-fail-fast 2>&1 | tee .github/tmp/cargo-test-output.txt
          test_exit_code="${PIPESTATUS[0]}"
          set -e

          read -r passed failed < <(awk '
            /^test result: / {
              for (i = 1; i <= NF; i++) {
                if ($i == "passed;") {
                  passed += $(i - 1)
                } else if ($i == "failed;") {
                  failed += $(i - 1)
                }
              }
            }
            END { print passed + 0, failed + 0 }
          ' .github/tmp/cargo-test-output.txt)

          if [[ "${test_exit_code}" == "0" ]]; then
            result='Passed'
          else
            result='Failed'
          fi

          printf 'exit_code=%s\n' "${test_exit_code}" >> "${GITHUB_OUTPUT}"
          printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
          printf 'passed=%s\n' "${passed}" >> "${GITHUB_OUTPUT}"
          printf 'failed=%s\n' "${failed}" >> "${GITHUB_OUTPUT}"

      - name: Measure MTB momentum-management build and run
        run: |
          mkdir -p .github/tmp
          marker='<!-- basilisk-rs-pr-benchmarks -->'

          /usr/bin/time -f '%e' -o .github/tmp/cold-build-seconds.txt \
            cargo build --release --example scenario_mtb_momentum_management

          cargo clean -p basilisk-rs --release

          /usr/bin/time -f '%e' -o .github/tmp/warm-build-seconds.txt \
            cargo build --release --example scenario_mtb_momentum_management

          /usr/bin/time -f '%e' -o .github/tmp/run-seconds.txt \
            ./target/release/examples/scenario_mtb_momentum_management \
            > .github/tmp/scenario-mtb-momentum-management-output.txt

          cold_build_seconds="$(tr -d '\n' < .github/tmp/cold-build-seconds.txt)"
          warm_build_seconds="$(tr -d '\n' < .github/tmp/warm-build-seconds.txt)"
          run_seconds="$(tr -d '\n' < .github/tmp/run-seconds.txt)"
          simulation_seconds='7200'
          binary_size_bytes="$(stat -c '%s' ./target/release/examples/scenario_mtb_momentum_management)"

          build_size="$(
            awk -v bytes="${binary_size_bytes}" '
              BEGIN {
                split("B KiB MiB GiB", units, " ");
                value = bytes + 0;
                unit = units[1];
                for (i = 1; i <= 4; i++) {
                  unit = units[i];
                  if (value < 1024 || i == 4) {
                    break;
                  }
                  value /= 1024;
                }
                if (unit == "B") {
                  printf "%d B", bytes;
                } else {
                  printf "%.2f %s", value, unit;
                }
              }
            '
          )"

          speedup="$(
            awk -v sim="${simulation_seconds}" -v wall="${run_seconds}" '
              BEGIN {
                if (wall <= 0) {
                  exit 1;
                }
                printf "%.2fx", sim / wall;
              }
            '
          )"

          cold_build_time="$(
            awk -v seconds="${cold_build_seconds}" '
              BEGIN {
                if (seconds < 60) {
                  printf "%.2fs", seconds;
                } else {
                  minutes = int(seconds / 60);
                  remaining = seconds - (minutes * 60);
                  printf "%dm %.2fs", minutes, remaining;
                }
              }
            '
          )"

          warm_build_time="$(
            awk -v seconds="${warm_build_seconds}" '
              BEGIN {
                if (seconds < 60) {
                  printf "%.2fs", seconds;
                } else {
                  minutes = int(seconds / 60);
                  remaining = seconds - (minutes * 60);
                  printf "%dm %.2fs", minutes, remaining;
                }
              }
            '
          )"

          {
            printf '%s\n' "${marker}"
            printf 'Cargo test: **%s**\n' '${{ steps.tests.outputs.result }}'
            printf 'Passed: `%s`\n' '${{ steps.tests.outputs.passed }}'
            printf 'Failed: `%s`\n' '${{ steps.tests.outputs.failed }}'
            printf 'Build size: `%s`\n' "${build_size}"
            printf 'scenario_mtb_momentum_management wall-clock runtime: `%ss`\n' "${run_seconds}"
            printf 'scenario_mtb_momentum_management simulation speedup: `%s`\n' "${speedup}"
            printf 'Cold build time: `%s`\n' "${cold_build_time}"
            printf 'Warm build time: `%s`\n' "${warm_build_time}"
          } > .github/tmp/pr-comment.md

      - name: Write PR summary
        run: cat .github/tmp/pr-comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Post PR comment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- basilisk-rs-pr-benchmarks -->';
            const body = fs.readFileSync('.github/tmp/pr-comment.md', 'utf8').trim();
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce test result
        if: ${{ steps.tests.outputs.exit_code != '0' }}
        run: exit 1
