[package]
name = "basilisk-rs"
version = "0.5.0"
edition = "2024"
description = "A Rust port of Basilisk"
license = "ISC"
repository = "https://github.com/ephraim71/basilisk-rs"
readme = "README.md"

[dependencies]
anise = { version = "0.9.6", default-features = false }
anyhow = "1.0.100"
hifitime = "4.2.6"
igrf = "0.2.0"
indicatif = "0.17.11"
libm = "0.2.16"
log = "0.4.29"
# `auto-download-mujoco`: the build fetches the official MuJoCo release
# matching the crate (3.17.0, the version upstream builds against) into
# `MUJOCO_DOWNLOAD_DIR`, which `.cargo/config.toml` points at `assets/mujoco`.
mujoco-rs = { version = "=7.1.0", optional = true, default-features = false, features = ["auto-download-mujoco"] }
nalgebra = { version = "0.33.2", default-features = false, features = ["std", "serde-serialize"] }
# `clang-runtime`: rust-spice's bindgen turns on clang-sys's runtime loading, and
# the binding generator then has to load libclang itself as well.
opencv = { version = "0.102.0", optional = true, default-features = false, features = ["clang-runtime", "dnn", "geometry", "imgcodecs", "imgproc"] }
prost = { version = "0.14.6", optional = true }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }
rand_distr = { version = "0.4.3", default-features = false, features = ["std"] }
rayon = "1.10.0"
rust-spice = { version = "1.0.1", optional = true, default-features = false, features = ["download"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
time = "0.3.47"
zmq = { version = "0.10.0", optional = true }

[build-dependencies]
prost-build = { version = "0.14.6", optional = true }

[features]
# The OpenCV image-processing modules (`fsw_algorithms::image_processing::
# {hough_circles, limb_finding, center_radius_cnn}`, `sensors::camera`). Links
# the system OpenCV (found through pkg-config, `opencv5` or `opencv4`) and
# needs libclang for the binding generator. Only the core, imgproc, imgcodecs
# and dnn bindings are used; OpenCV 5's small `geometry` module is generated
# too, as the only user of `std::vector<Vec4f>`, which `HoughCircles` needs
# to return its votes (OpenCV 4 has it in imgproc and ignores the module).
opencv = ["dep:opencv"]
# The MuJoCo multibody dynamics (`mujoco_dynamics`): upstream's `MJScene`,
# its general module files and the modules that run in its tasks. Links the
# MuJoCo shared library through mujoco-rs, which downloads the official
# release (see README) unless `MUJOCO_DYNAMIC_LINK_DIR` points at one.
mujoco = ["dep:mujoco-rs"]
# Vizard support (`vizard::VizInterface`, `vizard::DataFileToViz`): protobuf
# messages generated by prost-build, which needs `protoc`, and live streaming
# over ZeroMQ, which links libzmq.
vizard = ["dep:prost", "dep:prost-build", "dep:zmq"]
# `environment::spice_interface` on the NAIF CSPICE toolkit. The build fetches
# the CSPICE package from naif.jpl.nasa.gov (unless `CSPICE_DIR` points at an
# install) and needs libclang for its bindings.
spice = ["dep:rust-spice"]

[profile.samply]
inherits = "release"
debug = true

[[example]]
name = "scenario_orbit_multi_body"
required-features = ["spice"]

[[example]]
name = "scenario_basic_orbit_stream"
required-features = ["vizard"]

[[example]]
name = "scenario_vesta_orientation"
required-features = ["mujoco", "spice"]

[[example]]
name = "scenario_quad_maps"
required-features = ["vizard"]

[[example]]
name = "scenario_data_to_viz"
required-features = ["vizard"]

[[example]]
name = "scenario_spice_spacecraft"
required-features = ["spice"]

[[example]]
name = "scenario_monte_carlo_spice"
required-features = ["spice"]

[[example]]
name = "scenario_spice_reconstruction"
required-features = ["mujoco", "spice"]
