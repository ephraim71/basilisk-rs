[package]
name = "basilisk-rs"
version = "0.3.0"
edition = "2024"
description = "A Rust port of Basilisk"
license = "ISC"
repository = "https://github.com/ephraim71/basilisk-rs"
readme = "README.md"

[dependencies]
anise = { version = "0.9.6", default-features = false }
anyhow = "1.0.100"
hifitime = "4.2.6"
igrf = "0.2.0"
indicatif = "0.17.11"
log = "0.4.29"
nalgebra = { version = "0.33.2", default-features = false, features = ["std", "serde-serialize"] }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }
rand_distr = { version = "0.4.3", default-features = false, features = ["std"] }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = "0.3.47"

[profile.samply]
inherits = "release"
debug = true
